name: build-apk

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.KEYSTORE_B64 != '' }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate android/ scaffold (never built locally)
        run: flutter create --platforms android --org ai.dalideck --project-name dalideck .
        working-directory: .

      - name: Install deps
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Inject signing keystore
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          set -e
          echo "$KEYSTORE_B64" | base64 -d > android/app/dalideck.jks
          test -s android/app/dalideck.jks

      - name: Build APK (debug-signed build, resigned below)
        run: flutter build apk --release

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-unsigned
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Align and sign (zipalign + apksigner)
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_KEY_PASS: ${{ secrets.KEYSTORE_KEY_PASS }}
        run: |
          set -e
          ALIGNED=build/app/outputs/flutter-apk/aligned.apk
          SIGNED=build/app/outputs/flutter-apk/dalideck-app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | tail -1)
          "$BT/zipalign" -f 4 build/app/outputs/flutter-apk/app-release.apk "$ALIGNED"
          "$BT/apksigner" sign --ks android/app/dalideck.jks \
            --ks-key-alias "$KEYSTORE_ALIAS" \
            --ks-pass "env:KEYSTORE_PASS" \
            --key-pass "env:KEYSTORE_KEY_PASS" \
            --out "$SIGNED" "$ALIGNED"
          ls -la build/app/outputs/flutter-apk/*.apk

      - name: Upload signed APK
        if: env.HAS_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dalideck-apk
          path: build/app/outputs/flutter-apk/dalideck-app-release.apk

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_KEY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/dalideck-app-release.apk
          generate_release_notes: false