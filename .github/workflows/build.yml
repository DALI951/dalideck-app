name: build-apk

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.KEYSTORE_B64 != '' }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        continue-on-error: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate android/ scaffold (never built locally)
        run: flutter create --platforms android --org ai.dalideck --project-name dalideck .
        working-directory: .

      - name: Regenerate app icon into Android mipmaps
        run: |
          pip install pillow --quiet
          python dev/make_icons.py

      - name: Add required Android permissions
        run: |
          python - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          perms = {
              'android.permission.INTERNET': 'INTERNET',
              'android.permission.POST_NOTIFICATIONS': 'POST_NOTIFICATIONS',
              'android.permission.REQUEST_INSTALL_PACKAGES': 'REQUEST_INSTALL_PACKAGES',
              'android.permission.USE_BIOMETRIC': 'USE_BIOMETRIC',
              'android.permission.USE_FINGERPRINT': 'USE_FINGERPRINT',
          }
          for perm, label in perms.items():
              if perm not in s:
                  s = s.replace('</manifest>',
                      f'    <uses-permission android:name="{perm}"/>\n</manifest>')
                  print(f'Added {label}')
              else:
                  print(f'{label} already present')
          open(p, 'w').write(s)
          PY

      - name: Use FlutterFragmentActivity for biometric support
        run: |
          python - <<'PY'
          import glob
          # flutter create --org ai.dalideck generates the file under ai/dalideck/dalideck/
          matches = glob.glob('android/app/src/main/kotlin/**/MainActivity.kt', recursive=True)
          for p in matches:
              print('Found MainActivity.kt at', p)
              s = open(p).read()
              s = s.replace('import io.flutter.embedding.android.FlutterActivity',
                            'import io.flutter.embedding.android.FlutterFragmentActivity')
              s = s.replace('class MainActivity: FlutterActivity()',
                            'class MainActivity: FlutterFragmentActivity()')
              s = s.replace('class MainActivity : FlutterActivity()',
                            'class MainActivity : FlutterFragmentActivity()')
              open(p, 'w').write(s)
              print('Patched to FlutterFragmentActivity')
          PY

      - name: Configure Home Widget provider and permissions
        run: |
          python - <<'PY'
          import os

          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()

          # (a) Required permission so the widget can be re-armed after reboot
          if 'android.permission.RECEIVE_BOOT_COMPLETED' not in s:
              s = s.replace('</manifest>',
                  '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n</manifest>')
              print('Added RECEIVE_BOOT_COMPLETED')
          else:
              print('RECEIVE_BOOT_COMPLETED already present')

          # (b) home_widget 0.7.0 ships no Dart-side Glance API, so we register
          # the concrete components the plugin resolves at runtime: the widget
          # AppWidgetProvider itself (required for the launcher to list the
          # widget and for HomeWidget.updateWidget to reach it), the background
          # receiver/service (used by registerInteractivityCallback) and the
          # LAUNCH action that brings the app main activity to the foreground
          # on widget tap.
          if 'es.antonborri.home_widget.action.BACKGROUND' not in s:
              s = s.replace('</application>', '''            <receiver android:name="es.antonborri.home_widget.HomeWidgetBackgroundReceiver" android:exported="true">
            <intent-filter>
                <action android:name="es.antonborri.home_widget.action.BACKGROUND"/>
            </intent-filter>
            </receiver>
            <service android:name="es.antonborri.home_widget.HomeWidgetBackgroundService"
            android:permission="android.permission.BIND_JOB_SERVICE" android:exported="true"/>
            <receiver android:name="es.antonborri.home_widget.HomeWidgetProvider" android:exported="true"><intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"/></intent-filter><meta-data android:name="android.appwidget.provider" android:resource="@xml/home_widget"/></receiver>
            </application>''')
              print('Registered home_widget AppWidgetProvider and background receiver/service')
          else:
              print('home_widget background receiver/service already present')

          if 'es.antonborri.home_widget.action.LAUNCH' not in s:
              s = s.replace('</activity>', '''            <intent-filter>
                <action android:name="es.antonborri.home_widget.action.LAUNCH"/>
            </intent-filter>
            </activity>''')
              print('Added home_widget LAUNCH action to main activity')
          else:
              print('home_widget LAUNCH action already present')
          open(p, 'w').write(s)

          # (c) appwidget-provider metadata
          xml_dir = 'android/app/src/main/res/xml'
          layout_dir = 'android/app/src/main/res/layout'
          os.makedirs(xml_dir, exist_ok=True)
          os.makedirs(layout_dir, exist_ok=True)

          with open(os.path.join(xml_dir, 'home_widget.xml'), 'w') as f:
              f.write('''<?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="250dp"
              android:minHeight="110dp"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/layout"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen">
          </appwidget-provider>
          ''')
          print('Wrote res/xml/home_widget.xml')

          # (d) initial remote layout — compact dark card with the DaliDeck label
          with open(os.path.join(layout_dir, 'layout.xml'), 'w') as f:
              f.write('''<?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#0B0D10">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_gravity="center"
                  android:text="DaliDeck"
                  android:textColor="#DC2626"
                  android:textSize="18sp"
                  android:textStyle="bold"/>
          </FrameLayout>
          ''')
          print('Wrote res/layout/layout.xml')
          PY

      - name: Install deps
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Inject signing keystore
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          set -e
          echo "$KEYSTORE_B64" | base64 -d > android/app/dalideck.jks
          test -s android/app/dalideck.jks

      - name: Build APK (debug-signed build, resigned below)
        run: flutter build apk --release

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-unsigned
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Align and sign (zipalign + apksigner)
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_KEY_PASS: ${{ secrets.KEYSTORE_KEY_PASS }}
        run: |
          set -e
          ALIGNED=build/app/outputs/flutter-apk/aligned.apk
          SIGNED=build/app/outputs/flutter-apk/dalideck-app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | tail -1)
          "$BT/zipalign" -f 4 build/app/outputs/flutter-apk/app-release.apk "$ALIGNED"
          "$BT/apksigner" sign --ks android/app/dalideck.jks \
            --ks-key-alias "$KEYSTORE_ALIAS" \
            --ks-pass "env:KEYSTORE_PASS" \
            --key-pass "env:KEYSTORE_KEY_PASS" \
            --out "$SIGNED" "$ALIGNED"
          ls -la build/app/outputs/flutter-apk/*.apk

      - name: Upload signed APK
        if: env.HAS_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dalideck-apk
          path: build/app/outputs/flutter-apk/dalideck-app-release.apk

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_KEY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/dalideck-app-release.apk
          generate_release_notes: false