name: dalideck
description: DaliDeck for Android — syncs two-way with the DaliDeck website via a self-hosted API.
publish_to: 'none'
version: 0.3.2+14

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  dio: ^5.8.0+1
  open_file: ^3.5.4+1
  path_provider: ^2.1.5
  package_info_plus: ^8.1.3
  workmanager: ^0.10.7
  flutter_local_notifications: ^18.0.0
  crypto: ^3.0.3
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true