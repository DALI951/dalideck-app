name: dalideck
description: DaliDeck for Android — syncs two-way with the DaliDeck website via a self-hosted API.
publish_to: 'none'
version: 0.2.4+6

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  http: ^1.2.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true